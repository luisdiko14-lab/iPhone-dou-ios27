/* =====================================================================
   iPhone Duo · iOS 27 "Glass" web OS
   A book-style foldable with a seamless, crease-free inner display.

   How the "no crease" works:
   - Both halves render the SAME 776x836 canvas, each clipped to its half.
   - Inner (hinge-side) bezel, border and corner radius are 0 while open
     (driven by --k), so the two screens butt together with nothing between.
   - The left screen overlaps the seam by 1px so sub-pixel rounding never
     leaves a hairline.
   - Fold shading is scaled by --f, which is exactly 0 when fully open.
   ===================================================================== */
:root{ color-scheme:dark; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07080d;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column}
button{appearance:none;-webkit-appearance:none;border:0;background:none;color:inherit;font:inherit;cursor:pointer}

.bg{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(55% 45% at 18% 8%,#1c2160 0%,transparent 70%),
    radial-gradient(50% 50% at 92% 92%,#431456 0%,transparent 70%),
    radial-gradient(40% 40% at 70% 20%,#0b3a52 0%,transparent 70%),
    #07080d}

/* ---------- stage / rig ---------- */
.stage{position:relative;z-index:1;flex:1;min-height:0}
.rig{position:absolute;left:50%;top:50%;width:820px;height:880px;
  --a:0;--f:0;--k:0;--o:1;--s:1;
  transform:translate(-50%,-50%) scale(var(--s));transform-origin:50% 50%}
.persp{position:absolute;inset:0;perspective:2800px;perspective-origin:50% 50%}

.device{position:absolute;left:10px;top:10px;width:800px;height:860px;
  transform-style:preserve-3d;
  transform:translateX(calc(var(--f) * -200px));
  --blur:26;--bright:1;}

.dshadow{position:absolute;top:0;height:860px;left:calc(var(--f) * 400px);width:calc(800px - var(--f) * 400px);
  border-radius:58px;transform:translateZ(-24px);pointer-events:none;
  box-shadow:0 60px 110px -10px rgba(0,0,0,.65),0 0 160px rgba(120,90,255,.10)}

.half{position:absolute;top:0;width:400px;height:860px;transform-style:preserve-3d}
.half.r{left:400px}
.half.l{left:0;transform-origin:100% 50%;will-change:transform;
  transform:translateZ(calc(var(--f) * 7px)) rotateY(calc(var(--a) * 1deg))}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}

/* frames: bezel only on OUTER edges while open */
.frame{position:absolute;inset:0;background:#040406;border:2px solid #5d616c}
.fr{border-left-width:calc(var(--k) * 2px);
    border-radius:calc(var(--k) * 58px) 58px 58px calc(var(--k) * 58px)}
.fl{border-right-width:calc(var(--k) * 2px);
    border-radius:58px calc(var(--k) * 58px) calc(var(--k) * 58px) 58px}
.fc{border-radius:58px}

.screen{position:absolute;overflow:hidden;background:#0b0d1e}
/* Seam trick: while fully open (--o = 1) each half's screen overscans 180px past
   the seam. backdrop-filter blur is only "wrong" within ~3 sigma of a clipped
   edge (blur is capped at 40 => 120px), so with the clip edge 180px away the
   glass is pixel-identical on both sides of the hinge. A short 28px mask
   cross-fades the two identical copies. --o falls from 1 to 0 within the first
   6 degrees of fold, so the overscan is gone before the panels visibly separate. */
.sr{top:10px;bottom:10px;right:10px;left:calc(var(--k) * 10px - var(--o) * 180px);
    border-radius:calc(var(--k) * 46px) 46px 46px calc(var(--k) * 46px);
    -webkit-mask-image:linear-gradient(90deg,transparent calc(var(--o) * 124px),#000 calc(var(--o) * 152px));
            mask-image:linear-gradient(90deg,transparent calc(var(--o) * 124px),#000 calc(var(--o) * 152px))}
.sl{top:10px;bottom:10px;left:10px;right:calc(var(--k) * 10px - 1px - var(--o) * 180px);
    border-radius:46px calc(var(--k) * 46px) calc(var(--k) * 46px) 46px;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - (1 + 180 * var(--o)) * 1px),transparent calc(100% - (1 + 152 * var(--o)) * 1px));
            mask-image:linear-gradient(90deg,#000 calc(100% - (1 + 180 * var(--o)) * 1px),transparent calc(100% - (1 + 152 * var(--o)) * 1px))}
.sc{inset:10px;border-radius:46px}

.ui{position:absolute;top:0;width:776px;height:836px;font-size:15px;line-height:1.25}
#uiL{left:0}
#uiR{left:calc(-388px - var(--k) * 12px + var(--o) * 180px)}
.cover{position:absolute;inset:0;font-size:15px;line-height:1.25}

.dim{position:absolute;inset:0;background:#000;opacity:calc((1 - var(--bright)) * .8);pointer-events:none;z-index:50}
.shade{position:absolute;inset:0;pointer-events:none;z-index:51}
.sh-l{background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.5));opacity:calc(var(--f) * 1.3)}
.sh-r{background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0) 60%);opacity:calc(var(--f) * 1.3)}

/* ---------- wallpaper ---------- */
.wall{position:absolute;inset:0;overflow:hidden;
  background:linear-gradient(160deg,#0c0f33,#1b0f3d 52%,#082a3b)}
.wall i{position:absolute;border-radius:50%;will-change:transform}
.b1{left:-140px;top:-90px;width:560px;height:560px;background:radial-gradient(circle,#4f46ff 0%,transparent 68%);animation:d1 19s ease-in-out infinite alternate}
.b2{left:128px;top:70px;width:520px;height:520px;background:radial-gradient(circle,#ff3fa4 0%,transparent 66%);opacity:.85;animation:d2 23s ease-in-out infinite alternate}
.b3{left:420px;top:380px;width:560px;height:560px;background:radial-gradient(circle,#19d3ff 0%,transparent 66%);opacity:.9;animation:d3 21s ease-in-out infinite alternate}
.b4{left:-120px;top:520px;width:500px;height:500px;background:radial-gradient(circle,#ffb347 0%,transparent 66%);opacity:.55;animation:d2 26s ease-in-out infinite alternate-reverse}
.b5{left:400px;top:-130px;width:480px;height:480px;background:radial-gradient(circle,#9b5cff 0%,transparent 66%);animation:d1 17s ease-in-out infinite alternate-reverse}
.b6{left:190px;top:560px;width:520px;height:520px;background:radial-gradient(circle,#00e0b0 0%,transparent 66%);opacity:.45;animation:d3 28s ease-in-out infinite alternate}
@keyframes d1{from{transform:translate(0,0) scale(1)}to{transform:translate(90px,60px) scale(1.18)}}
@keyframes d2{from{transform:translate(0,0) scale(1.05)}to{transform:translate(-80px,70px) scale(.9)}}
@keyframes d3{from{transform:translate(0,0) scale(.95)}to{transform:translate(-70px,-90px) scale(1.15)}}

/* ---------- liquid glass ---------- */
.glass{position:absolute;overflow:hidden;border-radius:30px;
  background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.07) 55%,rgba(255,255,255,.13));
  -webkit-backdrop-filter:blur(calc(var(--blur) * 1px)) saturate(1.7) brightness(1.05);
          backdrop-filter:blur(calc(var(--blur) * 1px)) saturate(1.7) brightness(1.05);
  box-shadow:
    inset 0 1.2px 0 rgba(255,255,255,.65),
    inset 0 -1px 0 rgba(255,255,255,.18),
    inset 1.2px 0 0 rgba(255,255,255,.28),
    inset -1.2px 0 0 rgba(255,255,255,.14),
    0 14px 34px rgba(5,8,30,.28)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 70% at 18% -10%,rgba(255,255,255,.38),transparent 55%)}
.device[data-tint="1"] .glass{background:linear-gradient(145deg,rgba(130,150,255,.42),rgba(90,60,210,.22) 60%,rgba(130,150,255,.25))}
.device[data-tint="2"] .glass{background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 60%,rgba(255,255,255,.06))}

.abs{position:absolute}

.seg b{flex:1;text-align:center;padding:9px 0;border-radius:99px;font-size:14px;font-weight:600;cursor:pointer;transition:background .25s}

.field{margin-top:6px}
.field label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;opacity:.9}
.field input{width:100%;margin-top:2px}
.pgrid{position:absolute;left:24px;right:24px;top:72px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pgrid i{aspect-ratio:1;border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.generic{position:absolute;left:0;right:0;top:300px;text-align:center}
.generic .tile{margin:0 auto 18px;width:96px;height:96px;border-radius:28px}
.generic .tile svg{width:52px;height:52px}
.generic h2{font-size:30px}.generic p{opacity:.7;margin:8px auto 0;width:420px;font-size:16px}

/* ---------- range inputs ---------- */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:40px;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:16px;border-radius:99px;background:linear-gradient(90deg,rgba(255,255,255,.88) var(--p),rgba(255,255,255,.2) var(--p));box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-7px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4),inset 0 -2px 4px rgba(0,0,0,.12)}
input[type=range]::-moz-range-track{height:16px;border-radius:99px;background:rgba(255,255,255,.2)}
input[type=range]::-moz-range-progress{height:16px;border-radius:99px;background:rgba(255,255,255,.88)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}

/* ---------- cover screen ---------- */
.cam{position:absolute;left:50%;top:16px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:#000;box-shadow:0 0 0 2px rgba(255,255,255,.08),inset 0 0 6px rgba(80,110,255,.5);z-index:5}
.c-date{position:absolute;left:0;right:0;top:82px;text-align:center;font-size:19px;font-weight:600;opacity:.9}
.c-time{position:absolute;left:0;right:0;top:106px;text-align:center;font-size:112px;font-weight:300;letter-spacing:-4px;line-height:1.05}
.c-wx{left:16px;top:300px;width:168px;height:150px;padding:16px}
.c-wx .temp{font-size:44px;font-weight:300;margin-top:12px;line-height:1}
.c-bat{left:192px;top:300px;width:168px;height:150px;display:grid;place-items:center}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:600;
  background:conic-gradient(#34c759 0 78%,rgba(255,255,255,.18) 0)}
.ring span{display:grid;place-items:center;width:78px;height:78px;border-radius:50%;background:rgba(20,22,50,.55)}
.c-mu{left:16px;top:466px;width:344px;height:110px;padding:14px}
.c-mu .art{position:absolute;left:14px;top:14px;width:82px;height:82px;border-radius:16px}
.c-mu .tt{position:absolute;left:112px;top:20px;font-weight:600;font-size:16px}
.c-mu .ar{position:absolute;left:112px;top:42px;font-size:13px;opacity:.7}
.c-mu .ctrl{left:104px;right:8px;bottom:6px}
.c-mu .ctrl button{width:36px;height:36px}
.c-no{left:16px;top:592px;width:344px;height:96px;padding:16px;font-size:14px}
.c-no b{display:block;font-size:15px;margin-bottom:3px}
.c-no span{opacity:.8}
.c-circle{width:62px;height:62px;border-radius:50%;top:752px;display:grid;place-items:center}
.c-circle svg{width:28px;height:28px}
.c-unfold{left:96px;width:184px;height:54px;top:756px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:99px;font-weight:600;font-size:15px}
.c-unfold svg{width:18px;height:18px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}

/* ---------- entrance ---------- */
.welcome .pop{animation:pop .8s cubic-bezier(.2,1.1,.3,1) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.92)}to{opacity:1;transform:none}}

/* ---------- controls ---------- */
.controls{position:relative;z-index:5;margin:0 auto 18px;padding:12px 16px;display:flex;align-items:center;gap:14px;
  width:min(780px,calc(100% - 24px));border-radius:28px;
  background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.05));
  -webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 0 0 1px rgba(255,255,255,.07),0 12px 34px rgba(0,0,0,.45)}
.pill{padding:12px 24px;border-radius:99px;font-weight:600;font-size:15px;min-width:104px;
  background:linear-gradient(145deg,rgba(255,255,255,.32),rgba(255,255,255,.1));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 14px rgba(0,0,0,.3);transition:transform .2s}
.pill:active{transform:scale(.94)}
.hinge-wrap{flex:1;display:flex;align-items:center;gap:12px;min-width:140px;font-size:13px;font-weight:600;opacity:.95}
.hinge-wrap input{flex:1}
.state{min-width:84px;text-align:right;font-size:13px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
.hint{font-size:12px;opacity:.55;white-space:nowrap}
@media (max-width:640px){.hint{display:none}.controls{gap:10px;padding:10px 12px}.pill{padding:11px 16px;min-width:88px}.state{min-width:68px}}
@media (prefers-reduced-motion:reduce){.wall i,.dock .shine{animation:none}}
</style>
</head>
<body>
<div class="bg"></div>

<main class="stage" id="stage">
  <div class="rig" id="rig">
    <div class="persp">
      <div class="device" id="device" data-app="" data-play="0" data-wifi="1" data-bt="1" data-air="0" data-note="0" data-tint="0">
        <div class="dshadow"></div>

        <!-- RIGHT half (static) -->
        <div class="half r">
          <div class="face front">
            <div class="frame fr">
              <div class="screen sr">
                <div class="ui" id="uiR"></div>
                <div class="dim"></div>
                <div class="shade sh-r"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- LEFT half (folds over the right half) -->
        <div class="half l">
          <div class="face front">
            <div class="frame fl">
              <div class="screen sl">
                <div class="ui" id="uiL"></div>
                <div class="dim"></div>
                <div class="shade sh-l"></div>
              </div>
            </div>
          </div>
          <div class="face back">
            <div class="frame fc">
              <div class="screen sc">
                <div class="cover" id="cover"></div>
                <div class="dim"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="controls">
  <button class="pill" id="foldBtn" type="button">Fold</button>
  <label class="hinge-wrap"><span>Hinge</span><input id="hinge" type="range" min="0" max="180" step="0.5" value="0" aria-label="Hinge angle"></label>
  <span class="state" id="state">Unfolded</span>
  <span class="hint">Space / F · fold &amp; unfold</span>
</footer>

<script>
(() => {
'use strict';
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------------------------------------------------------------- icons */
const IC = {
  msg:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  photos:'<circle cx="12" cy="7" r="3.2"/><circle cx="17" cy="12" r="3.2"/><circle cx="12" cy="17" r="3.2"/><circle cx="7" cy="12" r="3.2"/>',
  camera:'<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  maps:'<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  weather:'<circle cx="9" cy="9" r="3"/><path d="M9 3v1.5M3 9h1.5M4.8 4.8l1 1M13.2 4.8l-1 1"/><path d="M8 20h9a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6 1.2A3 3 0 0 0 8 20z"/>',
  music:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
  notes:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 19h4"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  files:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  browser:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
  wallet:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/>',
  health:'<path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.5 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/>',
  podcasts:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/>',
  store:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  wifi:'<path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.6 16a5 5 0 0 1 6.8 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/>',
  bt:'<path d="M7 7l10 10-5 4V3l5 4L7 17"/>',
  air:'<path d="M21 15l-8-4V4.5a1.5 1.5 0 0 0-3 0V11l-8 4v2l8-2v4l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-4l8 2z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>',
  flash:'<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>',
  chev:'<path d="M9 5l7 7-7 7"/>',
  back:'<path d="M15 5l-7 7 7 7"/>'
};
const svg = (n, c = '') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const PLAY  = '<svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg><svg class="ic-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg>';
const NEXT  = '<svg viewBox="0 0 24 24"><path d="M5 5l9 7-9 7z"/><rect x="15.5" y="5" width="3" height="14" rx="1.2"/></svg>';
const PREV  = '<svg viewBox="0 0 24 24"><path d="M19 5l-9 7 9 7z"/><rect x="5.5" y="5" width="3" height="14" rx="1.2"/></svg>';

const APPS = [
  ['msg','Messages','#62f07d','#14b53f'],
  ['photos','Photos','#ffd86b','#ff5c8a'],
  ['camera','Camera','#c9cdd6','#6b7080'],
  ['maps','Maps','#6ee7a8','#2aa3ff'],
  ['weather','Weather','#4fc3ff','#2b6cff'],
  ['music','Music','#ff6b8b','#ff2d55'],
  ['notes','Notes','#ffe46b','#ffb800'],
  ['clock','Clock','#3b3f4d','#111218'],
  ['calendar','Calendar','#ffffff','#e6e7ee'],
  ['files','Files','#59b6ff','#1e6bff'],
  ['browser','Browser','#6bc7ff','#3a63ff'],
  ['settings','Settings','#aab0bf','#5a5f70'],
  ['wallet','Wallet','#2d2f3a','#0b0c10'],
  ['health','Health','#ff7aa8','#ff2d6f'],
  ['podcasts','Podcasts','#c58bff','#7a3bff'],
  ['store','Store','#58c4ff','#3c5cff']
];
const APPMAP = Object.fromEntries(APPS.map(a => [a[0], a]));
const tileBg = a => `background:linear-gradient(160deg,${a[2]},${a[3]})`;
const at = (x, y, w, h) => `left:${x}px;top:${y}px;${w != null ? `width:${w}px;` : ''}${h != null ? `height:${h}px;` : ''}`;

/* ------------------------------------------------------------- wallpaper */
const wall = () => '<div class="wall"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i><i class="b6"></i></div>';

/* ------------------------------------------------------------ app pages */
const dayName = i => i === 0 ? 'Today' : new Date(Date.now() + i * 864e5).toLocaleDateString(undefined, { weekday: 'short' });
const LOW = [16,15,17,18,16,14,15], HIGH = [27,26,28,29,25,23,24];

function appWeather() {
  const hrs = [['Now','24°',0],['+1h','25°',0],['+2h','26°',0],['+3h','26°',0],['+4h','24°',1],['+5h','21°',1]]
    .map(h => `<span>${h[0]}<i class="dot ${h[2] ? 'c' : ''}"></i><b>${h[1]}</b></span>`).join('');
  const week = LOW.map((l, i) => `<div class="row"><span style="width:56px">${dayName(i)}</span>
      <span class="dim2" style="width:34px;text-align:right">${l}°</span>
      <div class="bar"><i style="left:${(l - 12) / 20 * 100}%;width:${(HIGH[i] - l) / 20 * 100}%"></i></div>
      <span style="width:34px;text-align:right">${HIGH[i]}°</span></div>`).join('');
  return `
  <div class="pl">
    <div class="eyebrow">MY LOCATION · SIMULATED DATA</div>
    <div class="big" style="margin-top:14px">24°</div>
    <div class="sub" style="margin-top:6px">Mostly Sunny</div>
    <div class="dim2" style="margin-top:2px">H:27°  L:16°</div>
    <div class="tilebox" style="${at(0,250)}"><span class="eyebrow">FEELS LIKE</span><b>25°</b></div>
    <div class="tilebox" style="${at(178,250)}"><span class="eyebrow">UV INDEX</span><b>6</b></div>
    <div class="tilebox" style="${at(0,366)}"><span class="eyebrow">WIND</span><b>12 km/h</b></div>
    <div class="tilebox" style="${at(178,366)}"><span class="eyebrow">HUMIDITY</span><b>48%</b></div>
  </div>
  <div class="pr">
    <div class="card" style="${at(0,0,340,150)}"><span class="eyebrow">HOURLY FORECAST</span><div class="hrs">${hrs}</div></div>
    <div class="card" style="${at(0,166,340,360)}"><span class="eyebrow">7-DAY FORECAST</span><div style="margin-top:6px">${week}</div></div>
  </div>`;
}
function appMusic() {
  const q = [['Refraction','Duo Fold'],['Hinge Point','Seamless'],['Blue Hour Display','Glasswork'],['Foldlight','Duo Fold'],['Specular','Lumen Club'],['Zero Gap','Seamless']]
    .map(t => `<div class="qrow"><div class="art"></div><div><b>${t[0]}</b><small>${t[1]}</small></div></div>`).join('');
  return `
  <div class="pl">
    <div class="art big2"></div>
    <div class="meta"><h2>Glass Hours</h2><p>Duo Fold · demo track</p></div>
    <div class="bigprog"><i></i></div>
    <div class="bigctrl"><button data-toggle="play" aria-label="Previous">${PREV}</button>
      <button class="glass-btn" data-toggle="play" aria-label="Play or pause" style="background:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);width:72px;height:72px">${PLAY}</button>
      <button data-toggle="play" aria-label="Next">${NEXT}</button></div>
  </div>
  <div class="pr"><div class="card" style="${at(0,0,340,470)}"><span class="eyebrow">UP NEXT</span><div style="margin-top:6px">${q}</div></div></div>`;
}
function appNotes() {
  const list = [['Fold physics','Hinge notes'],['Glass recipe','Blur · saturate · highlight'],['Ideas','Weekend list']]
    .map((n, i) => `<button class="nitem" data-note-i="${i}" data-i="${i}"><b>${n[0]}</b><small>${n[1]}</small></button>`).join('');
  return `
  <div class="pl">${list}</div>
  <div class="pr" style="bottom:52px">
    <div class="note on" data-i="0"><h2>Fold physics</h2>The left half swings about the hinge line with a spring, so it overshoots a little and settles.<ul><li>Hinge angle runs 0–180°</li><li>Bezel appears only as it folds</li><li>Shading is exactly 0 when open</li></ul></div>
    <div class="note" data-i="1"><h2>Glass recipe</h2>Translucent gradient + backdrop blur + saturation boost.<ul><li>Bright top edge highlight</li><li>Soft inner rim light</li><li>Specular bloom in the corner</li></ul></div>
    <div class="note" data-i="2"><h2>Ideas</h2><ul><li>Split-view apps per half</li><li>Tent mode at 90°</li><li>Hinge-aware widgets</li></ul></div>
  </div>`;
}
function appClock() {
  const cities = [['Los Angeles','America/Los_Angeles'],['New York','America/New_York'],['London','Europe/London'],['Tokyo','Asia/Tokyo']]
    .map(c => `<div class="wc"><div><b>${c[0]}</b><small>World clock</small></div><span data-tz="${c[1]}"></span></div>`).join('');
  let ticks = '';
  for (let i = 0; i < 12; i++) ticks += `<i class="tick" style="transform:rotate(${i * 30}deg)"></i>`;
  return `
  <div class="pl"><div class="card" style="${at(0,0,340,340)}"><span class="eyebrow">WORLD CLOCK</span><div style="margin-top:6px">${cities}</div></div></div>
  <div class="pr"><div class="analog">${ticks}<i class="hand h"></i><i class="hand m"></i><i class="hand s"></i><i class="pin"></i></div>
    <div style="${at(0,350,340)};position:absolute;text-align:center;font-size:64px;font-weight:200;letter-spacing:-2px" data-hm></div></div>`;
}
function appSettings() {
  return `
  <div class="pl"><div class="card" style="${at(0,0,340,250)}">
    <div class="row"><span class="rg">${svg('wifi')} Wi-Fi</span><button class="sw" data-switch="wifi" aria-label="Wi-Fi"><i></i></button></div>
    <div class="row"><span class="rg">${svg('bt')} Bluetooth</span><button class="sw" data-switch="bt" aria-label="Bluetooth"><i></i></button></div>
    <div class="row"><span class="rg">${svg('air')} Airplane Mode</span><button class="sw" data-switch="air" aria-label="Airplane mode"><i></i></button></div>
    <div class="row"><span class="rg">Display crease</span><span class="dim2">None</span></div>
  </div></div>
  <div class="pr"><div class="card" style="${at(0,0,340,330)}">
    <div class="lg" style="font-size:22px;margin-bottom:2px">Liquid Glass</div>
    <div class="seg"><b data-seg="tint" data-v="2">Clear</b><b data-seg="tint" data-v="0">Frosted</b><b data-seg="tint" data-v="1">Tinted</b></div>
    <div class="field"><label><span>Blur</span></label><input type="range" data-var="blur" min="6" max="40" step="1" value="26"></div>
    <div class="field"><label><span>Brightness</span></label><input type="range" data-var="bright" min="0.35" max="1" step="0.01" value="1"></div>
  </div></div>`;
}
function appPhotos() {
  let t = '';
  for (let i = 0; i < 30; i++) {
    const h = (i * 37 + 200) % 360;
    t += `<i style="background:linear-gradient(135deg,hsl(${h},85%,62%),hsl(${(h + 50) % 360},80%,42%))"></i>`;
  }
  return `<div class="pgrid">${t}</div>`;
}
function appGeneric(key) {
  const a = APPMAP[key];
  return `<div class="generic"><div class="tile" style="${tileBg(a)}">${svg(key)}</div><h2>${a[1]}</h2>
    <p>Placeholder app. This demo wires up Weather, Music, Notes, Clock, Photos and Settings.</p></div>`;
}
const APPBODY = { weather: appWeather, music: appMusic, notes: appNotes, clock: appClock, settings: appSettings, photos: appPhotos };

function buildApps() {
  return APPS.map(a => {
    const k = a[0];
    const body = APPBODY[k] ? APPBODY[k]() : appGeneric(k);
    return `<section class="app" data-name="${k}">
      <div class="apphead"><button class="back" data-close>${svg('back')}Home</button><h1>${a[1]}</h1></div>${body}</section>`;
  }).join('');
}

/* ----------------------------------------------------------------- home */
function buildHome() {
  let i = 0;
  const pop = () => `--i:${i++}`;

  const icons = APPS.map((a, n) => {
    const col = n & 7, row = n >> 3;
    const cx = 48.5 + 97 * col, top = 424 + row * 100;
    const glyph = a[0] === 'calendar'
      ? '<span class="cal-d" data-dow></span><span class="cal-n" data-dnum></span>'
      : svg(a[0]);
    return `<button class="icon pop" style="${at(cx - 48.5, top)}${pop()}" data-open="${a[0]}" data-ox="${cx}" data-oy="${top + 32}" aria-label="${a[1]}">
      <span class="tile ${a[0] === 'calendar' ? 'cal' : ''}" style="${tileBg(a)}">${glyph}</span><span class="lbl">${a[1]}</span></button>`;
  }).join('');

  const dockKeys = ['msg', 'browser', 'camera', 'music', 'settings'];
  const dock = dockKeys.map((k, n) => {
    const a = APPMAP[k];
    return `<button class="icon" data-open="${k}" data-ox="${388 + (n - 2) * 74}" data-oy="774" aria-label="${a[1]}"><span class="tile" style="${tileBg(a)}">${svg(k)}</span></button>`;
  }).join('');

  return `
  ${wall()}
  <div class="home">
    <div class="sb"><span class="l" data-hm></span>
      <span class="r"><span>5G</span><span class="bars"><b></b><b></b><b></b><b></b></span><span class="batt"><i></i></span></span></div>

    <div class="glass clock-card pop" style="${at(148, 64, 480, 150)}${pop()}">
      <div class="t" data-hm></div><div class="d" data-date></div></div>

    <div class="glass wx pop" style="${at(24, 232, 340, 170)}${pop()}" data-open="weather" data-ox="194" data-oy="317">
      <div class="eyebrow">MY LOCATION</div><div class="temp">24°</div>
      <div class="cond">Mostly Sunny <span class="hl">&nbsp;H:27°  L:16°</span></div>
      <div class="mini"><span>Now<i class="dot"></i></span><span>+1h<i class="dot"></i></span><span>+2h<i class="dot"></i></span><span>+3h<i class="dot"></i></span><span>+4h<i class="dot c"></i></span></div>
    </div>

    <div class="glass mu pop" style="${at(412, 232, 340, 170)}${pop()}">
      <div class="art"></div><div class="tt">Glass Hours</div><div class="ar">Duo Fold</div>
      <div class="eq"><i></i><i></i><i></i></div>
      <div class="prog"><i></i></div>
      <div class="ctrl"><button data-toggle="play" aria-label="Previous">${PREV}</button><button data-toggle="play" aria-label="Play or pause">${PLAY}</button><button data-toggle="play" aria-label="Next">${NEXT}</button></div>
    </div>

    ${icons}

    <div class="glass strip pop" style="${at(24, 632, 728, 84)}${pop()}">
      <button class="rnd" style="left:20px" data-switch="wifi" aria-label="Wi-Fi">${svg('wifi')}</button>
      <button class="rnd" style="left:90px" data-switch="bt" aria-label="Bluetooth">${svg('bt')}</button>
      <button class="rnd" style="left:160px" data-switch="air" aria-label="Airplane mode">${svg('air')}</button>
      ${svg('sun', 'sun').replace('class="sun"', 'class="sun" style="left:232px"')}
      <input type="range" data-var="bright" min="0.35" max="1" step="0.01" value="1" aria-label="Brightness" style="left:272px;width:432px">
    </div>

    <div class="glass dock pop" style="${at(190, 734, 396, 80)}${pop()}border-radius:36px"><span class="shine"></span>${dock}</div>
    <div class="homebar" data-close></div>
  </div>
  ${buildApps()}`;
}

/* ---------------------------------------------------------------- cover */
function buildCover() {
  return `
  ${wall()}
  <div class="cam"></div>
  <div class="c-date" data-date></div>
  <div class="c-time" data-hm></div>

  <div class="glass c-wx pop" style="--i:0"><div class="eyebrow">MY LOCATION</div><div class="temp">24°</div><div style="margin-top:8px;font-weight:600">Mostly Sunny</div><div class="dim2" style="font-size:13px">H:27°  L:16°</div></div>
  <div class="glass c-bat pop" style="--i:1"><div class="ring"><span>78%</span></div></div>
  <div class="glass c-mu pop" style="--i:2"><div class="art"></div><div class="tt">Glass Hours</div><div class="ar">Duo Fold</div>
    <div class="ctrl"><button data-toggle="play" aria-label="Previous">${PREV}</button><button data-toggle="play" aria-label="Play or pause">${PLAY}</button><button data-toggle="play" aria-label="Next">${NEXT}</button></div></div>
  <div class="glass c-no pop" style="--i:3"><b>Unfold for the full screen</b><span>Open the inner display for a seamless, crease-free canvas.</span></div>

  <button class="glass c-circle pop" style="left:34px;--i:4" aria-label="Flashlight">${svg('flash')}</button>
  <button class="glass c-unfold pop" data-unfold style="--i:5">Unfold ${svg('chev')}</button>
  <button class="glass c-circle pop" style="right:34px;--i:6" aria-label="Camera">${svg('camera')}</button>`;
}

/* ---------------------------------------------------------------- mount */
const rig = $('#rig'), device = $('#device');
const homeHTML = buildHome();
$('#uiL').innerHTML = homeHTML;
$('#uiR').innerHTML = homeHTML;
$('#cover').innerHTML = buildCover();

/* ----------------------------------------------------------- live clock */
const hmEls = $$('[data-hm]'), dateEls = $$('[data-date]'), dnumEls = $$('[data-dnum]'),
      dowEls = $$('[data-dow]'), tzEls = $$('[data-tz]');
function tick() {
  const d = new Date();
  const h = d.getHours() % 12 || 12, m = String(d.getMinutes()).padStart(2, '0');
  const date = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  hmEls.forEach(e => e.textContent = `${h}:${m}`);
  dateEls.forEach(e => e.textContent = date);
  dnumEls.forEach(e => e.textContent = d.getDate());
  dowEls.forEach(e => e.textContent = d.toLocaleDateString(undefined, { weekday: 'short' }).toUpperCase());
  tzEls.forEach(e => {
    try { e.textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', timeZone: e.dataset.tz }); } catch (_) {}
  });
  const s = d.getSeconds(), mi = d.getMinutes() + s / 60, hr = (d.getHours() % 12) + mi / 60;
  device.style.setProperty('--hs', `${s * 6}deg`);
  device.style.setProperty('--hm', `${mi * 6}deg`);
  device.style.setProperty('--hh', `${hr * 30}deg`);
}
tick(); setInterval(tick, 1000);

/* ------------------------------------------------------- interactions */
const apps = $$('.app'), homes = $$('.home');
function openApp(name, ox, oy) {
  if (ox != null) { device.style.setProperty('--ox', ox + 'px'); device.style.setProperty('--oy', oy + 'px'); }
  device.dataset.app = name;
  apps.forEach(a => a.classList.toggle('open', a.dataset.name === name));
  homes.forEach(h => h.classList.add('away'));
}
function closeApp() {
  device.dataset.app = '';
  apps.forEach(a => a.classList.remove('open'));
  homes.forEach(h => h.classList.remove('away'));
}
function setNote(i) {
  device.dataset.note = i;
  $$('.note').forEach(n => n.classList.toggle('on', n.dataset.i === String(i)));
}
const paint = i => i.style.setProperty('--p', ((i.value - i.min) / (i.max - i.min) * 100) + '%');
function setVar(name, val) {
  if (name === 'blur') device.style.setProperty('--blur', val);
  if (name === 'bright') device.style.setProperty('--bright', val);
  $$(`input[data-var="${name}"]`).forEach(i => { if (+i.value !== +val) i.value = val; paint(i); });
}

device.addEventListener('click', e => {
  const t = e.target;
  let el;
  if ((el = t.closest('[data-unfold]'))) { setTarget(0); return; }
  if ((el = t.closest('[data-toggle]'))) {
    device.dataset.play = device.dataset.play === '1' ? '0' : '1'; return;
  }
  if ((el = t.closest('[data-switch]'))) {
    const k = el.dataset.switch; device.dataset[k] = device.dataset[k] === '1' ? '0' : '1'; return;
  }
  if ((el = t.closest('[data-seg]'))) { device.dataset[el.dataset.seg] = el.dataset.v; return; }
  if ((el = t.closest('[data-note-i]'))) { setNote(el.dataset.noteI); return; }
  if ((el = t.closest('[data-close]'))) { closeApp(); return; }
  if ((el = t.closest('[data-open]'))) { openApp(el.dataset.open, el.dataset.ox, el.dataset.oy); return; }
});
device.addEventListener('input', e => {
  const i = e.target.closest('input[data-var]');
  if (i) setVar(i.dataset.var, i.value);
});

/* Press feedback is driven from JS so BOTH copies of an icon react, even when
   the tap lands on the (hidden) overscan copy near the seam. */
let pressedEls = [];
function press(el, on) {
  if (!el) return;
  if (on) {
    pressedEls = $$('.icon').filter(i => i.dataset.open === el.dataset.open && i.dataset.ox === el.dataset.ox && i.dataset.oy === el.dataset.oy);
    pressedEls.forEach(i => i.classList.add('pressed'));
  } else { pressedEls.forEach(i => i.classList.remove('pressed')); pressedEls = []; }
}
device.addEventListener('pointerdown', e => press(e.target.closest('.icon'), true));
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => device.addEventListener(t, () => press(null, false)));
setVar('blur', 26); setVar('bright', 1);

/* --------------------------------------------------------- fold physics */
const slider = $('#hinge'), stateEl = $('#state'), btn = $('#foldBtn');
let a = 0, v = 0, target = 0, last = 0, raf = 0, wasFolded = false, wt = 0;

function welcome() {
  device.classList.remove('welcome'); void device.offsetWidth; device.classList.add('welcome');
  clearTimeout(wt); wt = setTimeout(() => device.classList.remove('welcome'), 1800);
}
function apply() {
  const f = a / 180, k = Math.min(1, a / 24);
  rig.style.setProperty('--a', a.toFixed(3));
  rig.style.setProperty('--f', f.toFixed(4));
  rig.style.setProperty('--k', k.toFixed(4));
  rig.style.setProperty('--o', Math.max(0, 1 - a / 6).toFixed(4));
  if (a > 120) wasFolded = true;
  if (wasFolded && a < 30) { wasFolded = false; welcome(); }
  if (!slider.matches(':active')) { slider.value = a; paint(slider); }
  stateEl.textContent = a < 1.5 ? 'Unfolded' : a > 178.5 ? 'Folded' : Math.round(a) + '°';
  btn.textContent = target > 90 ? 'Unfold' : 'Fold';
}
function step(now) {
  const dt = Math.min(0.032, (now - last) / 1000); last = now;
  const K = 150, C = 2 * Math.sqrt(K) * 0.74;
  v += (K * (target - a) - C * v) * dt;
  a += v * dt;
  if (a < 0) { a = 0; if (v < 0) v = 0; }
  if (a > 180) { a = 180; if (v > 0) v = 0; }
  if (Math.abs(target - a) < 0.04 && Math.abs(v) < 0.2) { a = target; v = 0; apply(); raf = 0; return; }
  apply(); raf = requestAnimationFrame(step);
}
function setTarget(t) {
  target = Math.max(0, Math.min(180, t));
  if (!raf) { last = performance.now(); raf = requestAnimationFrame(step); }
  btn.textContent = target > 90 ? 'Unfold' : 'Fold';
}
const toggleFold = () => setTarget(target > 90 ? 0 : 180);
btn.addEventListener('click', toggleFold);
slider.addEventListener('input', () => setTarget(+slider.value));
window.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (e.code === 'Space' || e.key.toLowerCase() === 'f') { e.preventDefault(); toggleFold(); }
});

/* ------------------------------------------------------------ fit-to-view */
function fit() {
  const r = $('#stage').getBoundingClientRect();
  const s = Math.min(r.width / 860, r.height / 920, 1.25);
  rig.style.setProperty('--s', Math.max(.2, s).toFixed(4));
}
window.addEventListener('resize', fit); fit();

/* test hook */
window.__duo = { setAngle(x){ a = target = x; v = 0; apply(); }, openApp, closeApp };

apply(); welcome();
})();
</script>
</body>
</html>
