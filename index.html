<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="description" content="iPhone Duo — a foldable iPhone with a crease-free display, running a Liquid Glass iOS 27 web OS with 20 working apps.">
<title>iPhone Duo · iOS 27</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='12.5' height='26' rx='5' fill='%237a5cff'/%3E%3Crect x='16.5' y='3' width='12.5' height='26' rx='5' fill='%23ff8ac2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/device.css">
<link rel="stylesheet" href="css/os.css">
<link rel="stylesheet" href="css/apps.css">
<link rel="stylesheet" href="css/setup.css">
</head>
<body>
<div class="bg"></div>

<main class="stage" id="stage">
  <div class="rig is-open" id="rig">
    <div class="persp">
      <div class="device" id="device" data-power="booting" data-locked="true" data-folded="false">
        <div class="dshadow"></div>
        <div class="shell"></div>

        <!-- RIGHT half: holds the LIVE inner display. While open it overscans across the left half. -->
        <div class="half r">
          <div class="face front">
            <div class="frame fr">
              <div class="screen sr">
                <div id="uiR"></div>
                <div class="dim"></div>
                <div class="shade sh-r"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- LEFT half: frozen clone of the inner UI on the front, LIVE cover display on the back -->
        <div class="half l">
          <div class="face front">
            <div class="frame fl">
              <div class="screen sl">
                <div class="ui k-inner" id="uiL" inert></div>
                <div class="dim"></div>
                <div class="shade sh-l"></div>
              </div>
            </div>
          </div>
          <div class="face back">
            <div class="frame fc">
              <div class="screen sc">
                <div id="uiC"></div>
                <div class="cam"></div>
                <div class="dim"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="controls">
  <button class="pill" id="foldBtn" type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="8" height="16" rx="2.5"/><rect x="13" y="4" width="8" height="16" rx="2.5"/></svg><span>Fold</span></button>
  <label class="hinge-wrap"><span>Hinge</span><input id="hinge" type="range" min="0" max="180" step="0.5" value="0" aria-label="Hinge angle"></label>
  <span class="state" id="state">Unfolded</span>
  <button class="pill round" id="powerBtn" type="button" aria-label="Power" title="Power (P)" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8M6.8 6.8a8 8 0 1 0 10.4 0"/></svg></button>
  <span class="hint">F · fold &nbsp; P · power</span>
</footer>

<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/os.js"></script>
<script src="js/setup.js"></script>
<!-- apps (each file registers its apps + background services) -->
<script src="js/apps/utility.js"></script>
<script src="js/apps/clock.js"></script>
<script src="js/apps/media.js"></script>
<script src="js/apps/music.js"></script>
<script src="js/apps/web.js"></script>
<script src="js/apps/social.js"></script>
<script src="js/apps/system.js"></script>
<script src="js/apps/creative.js"></script>
<script src="js/fold.js"></script>
<script src="js/main.js"></script>
</body>
</html>
