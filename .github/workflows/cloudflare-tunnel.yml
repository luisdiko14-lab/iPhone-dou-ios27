name: Run iPhone Duo + Cloudflare Tunnel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iphone-duo-cloudflare-tunnel
  cancel-in-progress: false

jobs:
  run-public-tunnel:
    name: Start web server and public tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check the project (syntax)
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile server.py
          for f in js/*.js js/apps/*.js; do node --check "$f"; done
          echo "Python and all 20 apps' JavaScript parse cleanly."

      - name: Smoke test DuoOS (boots, opens all 20 apps, runs the Python API)
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet playwright
          playwright install --with-deps chromium
          python tests/smoke.py 2>&1 | tee smoke.log

      - name: Report smoke test result
        if: always()
        shell: bash
        run: |
          {
            echo "## DuoOS smoke test: ${{ steps.smoke.outcome }}"
            echo
            echo '```'
            grep -E "^(PASS|FAIL)|ALL PASSED|FAILED|errors" smoke.log 2>/dev/null | sort | uniq -c | sort -rn | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start iPhone Duo server
        shell: bash
        env:
          HOST: 127.0.0.1
          PORT: "8080"
        run: |
          set -euo pipefail
          python -u server.py > server.log 2>&1 &
          echo "$!" > server.pid

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/ping | grep -q '"duo": true'; then
              curl --fail --silent http://127.0.0.1:8080/ | grep -q "iPhone Duo"
              echo "DuoOS server is up on port 8080 (Python backend online)."
              exit 0
            fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              cat server.log
              echo "server.py exited before becoming ready."
              exit 1
            fi
            sleep 2
          done

          cat server.log
          echo "Server did not become ready in time."
          exit 1

      - name: Install Cloudflare Tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output cloudflared
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Create public Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 \
            --loglevel info --logfile cloudflared.log &
          echo "$!" > cloudflared.pid

          for attempt in {1..60}; do
            URL="$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -n 1 || true)"
            if [ -n "$URL" ]; then
              {
                echo "## iPhone Duo is online"
                echo
                echo "**Public URL:** $URL"
                echo
                echo "This temporary Cloudflare Quick Tunnel is available while this workflow run is active."
                echo "Visitors get the OS only; the file, state and chat API is disabled for tunnel traffic."
              } >> "$GITHUB_STEP_SUMMARY"
              PUBLIC_URL="$URL"
              echo "PUBLIC_URL=$PUBLIC_URL" >> "$GITHUB_ENV"
              echo "Public URL: $PUBLIC_URL"
              break
            fi
            if ! kill -0 "$(cat cloudflared.pid)" 2>/dev/null; then
              cat cloudflared.log
              echo "Cloudflare Tunnel exited before creating a URL."
              exit 1
            fi
            sleep 2
          done

          if [ -z "${PUBLIC_URL:-}" ]; then
            cat cloudflared.log
            echo "Timed out waiting for a trycloudflare.com URL."
            exit 1
          fi

      - name: Verify the public URL serves DuoOS and keeps the backend private
        shell: bash
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent "$PUBLIC_URL/" | grep -q "iPhone Duo"; then
              echo "Public page OK."
              code="$(curl --silent --output /dev/null --write-out '%{http_code}' "$PUBLIC_URL/api/files?path=/" || true)"
              echo "Public /api/files returned HTTP $code (expected 403)."
              [ "$code" = "403" ] && echo "Backend is private over the tunnel." || echo "::warning::Unexpected status for public API: $code"
              exit 0
            fi
            sleep 4
          done
          echo "::warning::Could not reach the public URL yet from the runner (DNS may still be propagating)."

      - name: Keep server and tunnel alive
        shell: bash
        run: |
          set -euo pipefail
          echo "The public tunnel stays online until this workflow is stopped or the runner reaches its time limit."
          while kill -0 "$(cat server.pid)" 2>/dev/null && kill -0 "$(cat cloudflared.pid)" 2>/dev/null; do
            sleep 20
          done
          echo "The server or tunnel stopped unexpectedly."
          cat server.log || true
          cat cloudflared.log || true
          exit 1

      - name: Show logs if the job fails
        if: failure()
        shell: bash
        run: |
          echo "----- server.log -----"
          cat server.log 2>/dev/null || true
          echo "----- cloudflared.log -----"
          cat cloudflared.log 2>/dev/null || true
